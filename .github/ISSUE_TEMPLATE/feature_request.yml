name: Feature request
description: Something Off the Wall should do
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: The problem
      description: What keeps going wrong for you today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: What you would like
  - type: textarea
    attributes:
      label: How we would know it works
      description: A check or a measurement that would show the change helps.
