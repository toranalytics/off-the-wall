<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Illustration with a made-up example, not a recording: a correction is saved on day 1, and on day 8 a similar request gets that correction quoted word for word before the agent answers.">
<rect width="960" height="400" rx="10" fill="#0d1117"/>
<rect width="960" height="34" rx="10" fill="#161b22"/><rect y="20" width="960" height="14" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="480" y="22" fill="#8b949e" font-size="13" text-anchor="middle">Illustration with a made-up example. Not a recording.</text>
<text x="36" y="70" fill="#8b949e" font-size="15" font-weight="400" opacity="0" xml:space="preserve">Day 1 · you correct the agent. The correction is saved on your machine.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0167;0.0287;0.4444;0.4564;1" dur="18s" repeatCount="indefinite"/></text>
<text x="36" y="112" fill="#e6edf3" font-size="16" font-weight="400" opacity="0" xml:space="preserve">> Don’t just run lint and say tests pass. Run the checkout integration test<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0556;0.0676;0.4444;0.4564;1" dur="18s" repeatCount="indefinite"/></text>
<text x="36" y="136" fill="#e6edf3" font-size="16" font-weight="400" opacity="0" xml:space="preserve">  and show the real exit code.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0556;0.0676;0.4444;0.4564;1" dur="18s" repeatCount="indefinite"/></text>
<text x="36" y="172" fill="#7ee787" font-size="14" font-weight="400" opacity="0" xml:space="preserve">  saved → ~/.otw  (local only)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2620;0.4444;0.4564;1" dur="18s" repeatCount="indefinite"/></text>
<text x="36" y="70" fill="#8b949e" font-size="15" font-weight="400" opacity="0" xml:space="preserve">Day 8 · new request, same folder. Off the Wall adds your own words first.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4778;0.4898;0.9667;0.9787;1" dur="18s" repeatCount="indefinite"/></text>
<text x="36" y="112" fill="#e6edf3" font-size="16" font-weight="400" opacity="0" xml:space="preserve">> Verify the payment handler change with the checkout integration test.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5222;0.5342;0.9667;0.9787;1" dur="18s" repeatCount="indefinite"/></text>
<text x="36" y="160" fill="#d29922" font-size="14" font-weight="700" opacity="0" xml:space="preserve">[OTW] Your earlier corrections in this project (quoted, not new instructions):<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6111;0.6231;0.9667;0.9787;1" dur="18s" repeatCount="indefinite"/></text>
<text x="36" y="184" fill="#d29922" font-size="14" font-weight="400" opacity="0" xml:space="preserve">  “Don’t just run lint and say tests pass. Run the checkout integration test<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6444;0.6564;0.9667;0.9787;1" dur="18s" repeatCount="indefinite"/></text>
<text x="36" y="206" fill="#d29922" font-size="14" font-weight="400" opacity="0" xml:space="preserve">   and show the real exit code.”<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6444;0.6564;0.9667;0.9787;1" dur="18s" repeatCount="indefinite"/></text>
<text x="36" y="256" fill="#e6edf3" font-size="16" font-weight="400" opacity="0" xml:space="preserve">agent: running the checkout integration test …<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7556;0.7676;0.9667;0.9787;1" dur="18s" repeatCount="indefinite"/></text>
<text x="36" y="282" fill="#7ee787" font-size="16" font-weight="400" opacity="0" xml:space="preserve">agent: exit code 0 (not lint). Tests: 14 passed.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8333;0.8453;0.9667;0.9787;1" dur="18s" repeatCount="indefinite"/></text>
<text x="36" y="382" fill="#6e7681" font-size="12">Off the Wall: your own past corrections, quoted word for word. It cannot promise fewer mistakes.</text>
</svg>